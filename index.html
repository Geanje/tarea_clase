<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - DataStore Perú</title>
    <!-- Fuente moderna desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <!-- Tarjeta Principal -->
        <article class="card">
            <span class="badge">Oficial Perú 🇵🇪</span>
            
            <h1>Bienvenido a <span>DataStore</span></h1>
            
            <p>Encuentra los mejores componentes y periféricos de última generación con garantía local y envío rápido.</p>
            
            <!-- Bloque Visual / Imagen -->
            <div class="bloque-visual">
                <img src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7?q=80&w=800&auto=format&fit=crop" alt="Componentes de Computadora DataStore">
            </div>
            
            <!-- Acciones -->
            <div class="card-action">
                <button id="btn-comprar">Explorar Catálogo →</button>
            </div>
        </article>
    </main>

</body>

</html>
